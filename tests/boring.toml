[project]
name    = "boring-ui-tests"
version = "0.1.0"

# boring-ui is a plain `src/` consumed through a `[deps]` path entry. This file gives the tests
# `use ui.core.*` (and `use render.raster.*`, the renderer project) something to resolve against.
[deps]
ui = ".."
render = "../render"
todo = "../examples/todo"
