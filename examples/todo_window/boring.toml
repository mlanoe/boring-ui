[project]
name    = "todo-window"
version = "0.1.0"
main    = "main.br"

# The Todo application drawn into a native window by the tiled kernel rasterizer.
# Build: boring build --target wgpu   (or simd)
[deps]
ui     = "../.."
render = "../../render"
todo   = "../todo"
text   = "../../text"

# The real font: swash is called from Boring source (text/), so the window needs the crate and its borrow forms.
[dependencies]
swash = "0.2.10"
unicode-bidi = "0.3.18"

[external_fns]
"FontRef::fromIndex" = ["&", ""]
"Render::new" = ["&"]
"Render::render" = ["&mut", ""]
"Render::format" = [""]
"Render::offset" = [""]
